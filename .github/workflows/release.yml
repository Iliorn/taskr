name: Release

# Push a version tag to cut a release:
#   git tag v1.10.0 && git push origin v1.10.0
# This builds the Linux and Windows targets with the tag baked in as the version and
# publishes them as a GitHub release. Asset names are load-bearing — the
# in-app self-update fetches these exact names (selfUpdateAsset in helpers.go),
# and an already-installed binary looks for the name it was built to expect, so
# a name can be added but never renamed.
# macOS is distributed from tagged source through Homebrew, not release assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries
        # `-s -w` strips the symbol table and DWARF debug info, cutting
        # ~30% off each release binary with no functional change. Local
        # `go build .` (used during development) does NOT pass these flags
        # so `dlv` and rich panic stack traces stay available there.
        #
        # `-trimpath` removes the builder's filesystem paths from the binary,
        # which is what makes the build reproducible: anyone with the tag and
        # the Go version from go.mod can rebuild and compare hashes against
        # SHA256SUMS. That check is worth more than the checksums alone —
        # those only prove the download matches what this workflow published,
        # not that what it published matches this source.
        env:
          LDFLAGS: -s -w -X main.appVersion=${{ github.ref_name }}
          CGO_ENABLED: 0
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o taskr .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o taskr-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o taskr.exe .

      # Lets anyone verify a download, and gives packagers something to pin.
      - name: Checksums
        run: sha256sum taskr taskr-linux-arm64 taskr.exe > SHA256SUMS

      # A Scoop manifest and a PKGBUILD both pin a version and a checksum, so
      # a copy kept by hand in the tree is stale the moment the next tag is
      # pushed - and stale in the checksum, which is the part users trust.
      # Generating them here from the binaries just built makes both correct
      # by construction. The Scoop manifest ships as a release asset so
      # `scoop install .../releases/latest/download/taskr.json` always points
      # at the newest release without anything to bump.
      - name: Package manifests
        run: packaging/generate-packages.sh "${{ github.ref_name }}" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
        run: |
          gh release create "$V" --title "$V" --generate-notes \
            taskr taskr-linux-arm64 taskr.exe SHA256SUMS taskr.json PKGBUILD
